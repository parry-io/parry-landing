name: Security Scan

# SOC2 vulnerability-management + supply-chain controls (36 / CC7.1) for
# parry-landing (marketing site), matching the other repos: secret detection
# and an npm dependency/config vulnerability scan on every PR + push.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Install the gitleaks BINARY rather than use gitleaks-action@v2.
      # The ACTION requires a paid licence for organisations — it exits
      # with "[parry-io] is an organization. License key is required."
      # before scanning anything, which is why this job has never once
      # detected a secret. The binary itself is MIT and unrestricted.
      # Same approach parry-core/.github/workflows/security.yml uses.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (npm deps + config)
        # `@0.28.0` is not a published tag — the job failed with
        # "Unable to resolve action, unable to find version" and never
        # ran a scan. `v0.36.0` is the tag parry-core pins.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
